<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Agriculture</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f0fdf4 0%, #f8fafc 50%, #eef9f4 100%);
            color: var(--text-dark);
            text-align: center;
            padding: 40px 20px;
            position: relative;
            overflow: hidden;
        }

        /* Animated background circles */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.08;
            animation: floatCircle 8s ease-in-out infinite;
        }

        body::before {
            width: 400px;
            height: 400px;
            background: var(--primary-color);
            top: -100px;
            right: -100px;
        }

        body::after {
            width: 300px;
            height: 300px;
            background: var(--accent-color);
            bottom: -80px;
            left: -80px;
            animation-delay: 2s;
            animation-direction: reverse;
        }

        @keyframes floatCircle {
            0%, 100% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.15) translate(20px, -20px); }
        }

        /* Floating leaves background */
        .page-leaves {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .page-leaf {
            position: absolute;
            font-size: 1.4rem;
            opacity: 0;
            animation: leaf404Fall linear infinite;
        }

        @keyframes leaf404Fall {
            0% { opacity: 0; transform: translateY(-40px) rotate(0deg); }
            10% { opacity: 0.5; }
            90% { opacity: 0.3; }
            100% { opacity: 0; transform: translateY(calc(100vh + 40px)) rotate(500deg) translateX(60px); }
        }

        /* Main content */
        .error-wrapper {
            position: relative;
            z-index: 1;
        }

        .error-icon {
            font-size: 5rem;
            margin-bottom: 10px;
            animation: plantGrow 2s ease-in-out infinite;
        }

        @keyframes plantGrow {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.1) rotate(-5deg); }
            75% { transform: scale(1.1) rotate(5deg); }
        }

        .error-code {
            font-family: 'Outfit', sans-serif;
            font-size: 9rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 10px;
            animation: error404Bounce 2.5s ease-in-out infinite;
            text-shadow: none;
        }

        .error-code span {
            display: inline-block;
        }

        .error-code span:nth-child(1) { animation: letterFloat 2s ease-in-out infinite; }
        .error-code span:nth-child(2) { animation: letterFloat 2s ease-in-out infinite 0.3s; }
        .error-code span:nth-child(3) { animation: letterFloat 2s ease-in-out infinite 0.6s; }

        @keyframes letterFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes error404Bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .error-message {
            font-size: 1.4rem;
            font-weight: 500;
            color: #4b5563;
            margin-bottom: 10px;
            max-width: 500px;
        }

        .error-submessage {
            font-size: 1rem;
            color: #6b7280;
            margin-bottom: 35px;
            max-width: 400px;
        }

        .social-icons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }

        .social-icon {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(46, 139, 87, 0.08);
            border: 1px solid rgba(46, 139, 87, 0.15);
            color: var(--primary-color);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .social-icon:hover {
            background: var(--accent-color);
            color: white;
            transform: translateY(-6px);
            box-shadow: 0 8px 20px rgba(46, 139, 87, 0.35);
        }

        .btn-group-404 {
            display: flex;
            gap: 16px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Decorative divider */
        .error-divider {
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            border-radius: 4px;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <!-- Floating leaves -->
    <div class="page-leaves" id="pageLeaves"></div>

    <div class="error-wrapper">
        <div class="error-icon">🌱</div>
        <div class="error-code"><span>4</span><span>0</span><span>4</span></div>
        <div class="error-divider"></div>
        <div class="error-message">Oops! This page seems to have wilted.</div>
        <div class="error-submessage">The page you're looking for doesn't exist or has been moved to a new field.</div>

        <div class="btn-group-404">
            <a href="index.html" class="btn-primary">🏠 Back to Home</a>
            <a href="index.html#services" class="btn-secondary">🌿 Our Services</a>
        </div>

        <div class="social-icons">
            <a href="#" class="social-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg></a>
            <a href="#" class="social-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.84 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/></svg></a>
            <a href="#" class="social-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg></a>
        </div>
    </div>

    <script>
        // Floating leaves for 404 page
        const leavesContainer = document.getElementById('pageLeaves');
        const leafEmojis = ['🍃', '🌿', '☘️', '🍀', '🌱'];
        function createLeaf() {
            const leaf = document.createElement('span');
            leaf.className = 'page-leaf';
            leaf.textContent = leafEmojis[Math.floor(Math.random() * leafEmojis.length)];
            leaf.style.left = Math.random() * 100 + '%';
            leaf.style.fontSize = (1 + Math.random() * 1) + 'rem';
            leaf.style.animationDuration = (6 + Math.random() * 6) + 's';
            leaf.style.animationDelay = Math.random() * 2 + 's';
            leavesContainer.appendChild(leaf);
            setTimeout(() => { if (leaf.parentNode) leaf.parentNode.removeChild(leaf); }, 15000);
        }
        setInterval(createLeaf, 2000);
        for (let i = 0; i < 6; i++) setTimeout(createLeaf, i * 400);
    </script>
</body>
</html>
